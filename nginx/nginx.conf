# Selectt Platform — Hardened Nginx Production Reverse Proxy Configuration

# Global Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

upstream selectt_api {
    server 127.0.0.1:5000 max_fails=3 fail_timeout=30s;
    keepalive 32;
}

# ============================================================
# HTTP to HTTPS Redirect (Uncomment once SSL certbot is issued)
# ============================================================
# server {
#     listen 80;
#     listen [::]:80;
#     server_name selectt.in www.selectt.in admin.selectt.in;
#     return 301 https://$host$request_uri;
# }

server {
    listen 80;
    server_name selectt.in www.selectt.in admin.selectt.in localhost;

    # Security: Hide Nginx Version
    server_tokens off;

    # Maximum file upload size (Matches Multer 15MB limit)
    client_max_body_size 20M;

    # Core Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    # Block access to hidden files (.git, .env, etc.)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Block access to database backups, logs, and sensitive extensions
    location ~* \.(sql|bak|log|conf|sh|env|json|pem|key)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Static Frontend SPA (Vite Build)
    root /var/www/selectt/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Static Assets (JS, CSS, WebP, Fonts)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|svg)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    # Public Uploaded Images/Files
    location /uploads/ {
        alias /var/www/selectt/backend/public/uploads/;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        add_header X-Content-Type-Options "nosniff";
        # Prevent script execution inside upload directory
        location ~* \.(php|pl|py|jsp|asp|sh|cgi|exe)$ {
            deny all;
        }
    }

    # Reverse Proxy to Express API
    location /api/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://selectt_api;
        proxy_http_version 1.1;
        
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # Rate-limited Auth & OTP Endpoints
    location /api/auth/ {
        limit_req zone=auth_limit burst=15 nodelay;
        proxy_pass http://selectt_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

